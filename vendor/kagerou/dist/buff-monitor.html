<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buff 提示</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei UI",system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent;overflow:hidden}body{padding:7px;color:#fff}.panel{display:flex;gap:8px;min-height:132px;padding:7px;border:1px solid #ffffff38;border-radius:12px;background:rgba(12,14,20,.84);box-shadow:0 6px 22px #0006;-webkit-app-region:drag}.buff{--accent:#e8bd69;width:106px;min-height:116px;display:flex;align-items:center;flex-direction:column;gap:4px;border-radius:8px;border:1px solid #ffffff24;background:linear-gradient(155deg,#3d3324,#191a20);text-align:center}.buff.lin{--accent:#81b9ff;background:linear-gradient(155deg,#273f60,#171e2d)}.buff.bengjie{--accent:#e69b7c;background:linear-gradient(155deg,#4a302a,#21191c)}.buff.xueji{--accent:#f087a1;background:linear-gradient(155deg,#592b3b,#24171f)}.buff.xueji.phase-pending,.buff.xueji.phase-unknown{--accent:#b9aeb4;background:linear-gradient(155deg,#383238,#201d24)}.buff.xueji.phase-active{border-color:#ff8ab0;box-shadow:0 0 12px #ff5a994d}.buff.hidden{display:none}.name{padding-top:4px;font-size:15px;font-weight:800;text-shadow:0 1px 3px #000}.variant{font-size:10px;color:var(--accent);padding-bottom:3px}.dial{position:relative;isolation:isolate;width:68px;height:68px;display:grid;place-items:center;border-radius:50%;border:1px solid #ffffff35;background:#11151e;box-shadow:inset 0 0 10px #0009,0 1px 6px #0007}.dial:before{content:"";position:absolute;inset:3px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--progress,0)*360deg),#ffffff08 0);opacity:.62;z-index:-1}.dial:after{content:"";position:absolute;inset:1px;border-radius:50%;background:repeating-conic-gradient(#ffffffa0 0deg 1.5deg,transparent 1.5deg 30deg);mask:radial-gradient(transparent 58%,#000 60%);pointer-events:none}.time{font-variant-numeric:tabular-nums;font-size:25px;line-height:1;font-weight:800;text-shadow:0 1px 4px #000,0 0 7px #000}.soon{border-color:#efb656}.urgent{border-color:#f27676;box-shadow:0 0 10px #f0705044}@keyframes pulse{to{box-shadow:0 0 10px #f0705044}}.empty{display:grid;place-items:center;width:336px;color:#c9cdd7;font-size:12px}.drag-note{position:fixed;right:10px;bottom:3px;font-size:9px;color:#9ea7b7;opacity:.55;pointer-events:none}.locked .drag-note{display:none}
.locked .panel{background:transparent;border-color:transparent;box-shadow:none;-webkit-app-region:no-drag}
.locked .empty{visibility:hidden}

#panel{height:calc(100vh - 14px);align-content:start;display:grid;grid-template-columns:repeat(auto-fit,minmax(98px,1fr));overflow-y:auto}
.buff{width:100%;min-width:0}.empty{grid-column:1/-1;width:auto;min-height:110px}
#panel.has-overflow{-webkit-app-region:no-drag}#prefs-open{position:absolute;right:9px;top:4px;cursor:pointer}
#prefs-open,#prefs{-webkit-app-region:no-drag}.locked #prefs-open,#prefs[hidden]{display:none}
#prefs-open,#prefs button,#prefs input,#prefs select{font:inherit;background:#252c39;color:#f5f6f8;border:1px solid #657183;border-radius:5px;padding:4px 7px}
#prefs-open{font-size:11px}
#prefs{position:absolute;inset:6px;display:flex;flex-direction:column;gap:7px;background:#181c25;border:1px solid #61687b;border-radius:8px;padding:9px;font-size:12px}
.search,.actions{display:flex;gap:6px;align-items:center}.search input{min-width:0;flex:1}
#choices{flex:1;min-height:24px;overflow:auto;display:flex;align-content:flex-start;flex-wrap:wrap;gap:4px;list-style:none;margin:0;padding:0}
#choices li{max-width:100%;display:flex;align-items:center;gap:4px;background:#272e3b;border-radius:5px;padding:3px 5px;overflow-wrap:anywhere}
#choices button{padding:0 4px;cursor:pointer}#folder{min-width:0;flex:1;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;text-align:left}
#settings-message:empty{display:none}#settings-message{color:#ffd896}
</style></head><body>
<div class="panel" id="panel"><div class="empty" id="empty">等待自身 Buff 状态</div></div>
<template id="card"><div class="buff"><div class="name"></div><div class="dial"><div class="time"></div></div><div class="variant"></div></div></template>
<button id="prefs-open" aria-label="监控和记录设置">设置</button>
<form id="prefs" hidden><strong>自选 Buff / Debuff</strong>
<label>本人角色 <select id="subject" aria-label="本次监控的本人角色"><option value="">自动识别</option></select></label>
<small>未自动识别时可选择自己的角色；选择仅对本次采集会话有效。</small>
<div class="search"><select id="scope" aria-label="状态监控对象"><option value="self">自身 Buff</option><option value="boss">Boss Debuff</option></select><input id="search" aria-label="状态名称或 ID" placeholder="搜索名称或输入状态 ID" list="matches" autocomplete="off"><datalist id="matches"></datalist><button type="button" id="add">添加</button></div>
<ul id="choices" aria-label="已选监控状态"></ul>
<output id="settings-message" role="status"></output>
<div class="actions"><button id="folder" type="button" title="下一次采集会话生效">记录目录</button><button type="submit">保存</button><button id="prefs-close" type="button">取消</button></div></form>
<div class="drag-note">拖动调整位置 · 锁定后鼠标穿透</div>
<script>
'use strict';
const $=sel=>document.querySelector(sel);
const prefs=$('#prefs'), panel=$('#panel'),choices=$('#choices'),search=$('#search'),message=$('#settings-message');
let state={buffs:[],locked:false},receivedAt=Date.now(),countdown=null;
const cards=new Map();
let lastLayout='';
function layout(){
  const count=cards.size,editing=!prefs.hidden;
  const key=count+'|'+editing;
  if(key===lastLayout)return;
  lastLayout=key;window.yysls.monitorLayout(count,editing);
  requestAnimationFrame(()=>panel.classList.toggle('has-overflow',panel.scrollHeight>panel.clientHeight));
}
function closeEditor(){
  prefs.hidden=true;
  layout();
}
const text=(node,value)=>{const next=String(value??'');if(node.textContent!==next)node.textContent=next;};
function render(){
  document.body.classList.toggle('locked',state.locked);
  if(state.locked&&!prefs.hidden)closeEditor();
  const rows=(state.buffs||[]).filter(Boolean);
  const current=new Set();
  rows.forEach((row,index)=>{
    const key=row.key||row.id||String(index);
    current.add(key);
    let node=cards.get(key);
    if(!node){
      node=$('#card').content.firstElementChild.cloneNode(true);
      cards.set(key,node);
    }
    if(panel.children[index+1]!==node)panel.insertBefore(node,panel.children[index+1]||null);
    const remaining=typeof row.remainingSeconds==='number'?Math.max(0,row.remainingSeconds-(Date.now()-receivedAt)/1000):NaN;
    const css=['buff',row.style||'',row.phase?'phase-'+row.phase:'',remaining<=2?'urgent':remaining<=4?'soon':''].filter(Boolean).join(' ');
    if(node.className!==css)node.className=css;
    const progress=String(Math.round((Number.isFinite(remaining)&&row.durationSeconds>0?Math.min(1,remaining/row.durationSeconds):0)*100)/100);
    if(node.style.getPropertyValue('--progress')!==progress)node.style.setProperty('--progress',progress);
    text(node.querySelector('.name'),row.name);text(node.querySelector('.variant'),[row.target==='boss'?'Boss · '+row.targetName:null,row.variant].filter(Boolean).join(' · '));
    text(node.querySelector('.time'),Number.isFinite(remaining)?remaining.toFixed(1):'--');
  });
  for(const [key,node] of cards)if(!current.has(key)){node.remove();cards.delete(key);}
  const empty=$('#empty'),display=rows.length?'none':'grid';
  if(!rows.length)text(empty,state.configuredCount===0?'还未选择监控状态，点「设置」添加':({'catching-up':'正在同步当前 Buff 状态','interrupted':'采集已中断，等待状态重新同步','waiting-identity':'等待识别本人，可在设置中选择自己的角色','identity-conflict':'角色身份有冲突，请在设置中确认本人','waiting-boss':'等待识别本场 Boss，不显示其他目标的 Debuff'}[state.status]||'等待所选 Buff / Debuff 触发'));
  if(empty.style.display!==display)empty.style.display=display;
  layout();
  if(!rows.some(r=>Number.isFinite(r.remainingSeconds)&&r.remainingSeconds>(Date.now()-receivedAt)/1000)){clearInterval(countdown);countdown=null;}
}
function schedule(){
  clearInterval(countdown);countdown=null;
  if(!document.hidden&&state.buffs?.some(r=>r&&Number.isFinite(r.remainingSeconds)&&r.remainingSeconds>0))countdown=setInterval(render,100);
}
window.addEventListener('resize',()=>panel.classList.toggle('has-overflow',panel.scrollHeight>panel.clientHeight));
let names={},groups={},catalog=[],draft=new Set(),revision=0,busy=false,settingsSession=null;
function label(key){return groups[key]?groups[key]+'（全部变体）':names[key]?names[key]+' · '+key:'ID '+key;}
const scoped=key=>$('#scope').value==='boss'?'boss:'+key:key;
const encode=item=>typeof item==='string'?item:item.target==='boss'?'boss:'+item.key:item.key;
const decode=key=>key.startsWith('boss:')?{key:key.slice(5),target:'boss'}:key;
function addChip(key){
  const li=document.createElement('li'),remove=document.createElement('button'),scope=document.createElement('button');
  const boss=key.startsWith('boss:'),raw=boss?key.slice(5):key;
  scope.type='button';scope.textContent=boss?'Boss Debuff':'自身 Buff';scope.title='点击切换监控对象';
  scope.onclick=()=>{const next=boss?raw:'boss:'+raw;if(draft.has(next)){message.value='该对象的状态已在列表中';return;}draft=new Set([...draft].map(item=>item===key?next:item));choices.replaceChildren();draft.forEach(addChip);message.value='';};
  li.append(scope,document.createTextNode(label(raw)));remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','移除 '+label(raw));
  remove.onclick=()=>{draft.delete(key);li.remove();message.value='';};
  li.append(remove);choices.append(li);
}
function options(){
  const q=search.value.trim(),list=$('#matches');list.replaceChildren();
  if(!q)return;
  let shown=0;
  for(const [key,name] of catalog){
    if(draft.has(scoped(key))||(!key.startsWith(q)&&!name.includes(q)))continue;
    const item=document.createElement('option');item.value=label(key);list.append(item);
    if(++shown===30)break;
  }
}
function add(){
  const q=search.value.trim();if(!q)return false;
  let key;
  if(/^[1-9]\d{0,9}$/.test(q))key=q;
  else{
    const found=catalog.filter(([id,name])=>label(id)===q||name===q);
    if(found.length!==1){message.value=found.length?'有多个同名状态，请选择带 ID 的一项。':'请选择匹配的状态，或输入数字 ID。';return false;}
    key=found[0][0];
  }
  key=scoped(key);
  if(draft.has(key)){message.value='该状态已在列表中';search.value='';options();return true;}
  draft.add(key);addChip(key);search.value='';options();message.value='';search.focus();return true;
}
search.oninput=options;$('#scope').onchange=options;$('#add').onclick=add;
search.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();add();}};
$('#prefs-open').onclick=async()=>{
  const request=++revision;
  try{
    const data=await window.yysls.monitorSettings();
    if(request!==revision||state.locked)return;
    names=data.names;groups=data.groups;catalog=[...Object.entries(names),...Object.entries(groups)];
    settingsSession=data.sessionId;
    const subject=$('#subject');subject.replaceChildren(new Option('自动识别',''));
    for(const row of data.subjects||[])subject.append(new Option(row.name+' · '+row.id.slice(-6),row.id));
    subject.value=data.subject||'';
    choices.replaceChildren();draft=new Set(data.selection.map(encode));draft.forEach(addChip);
    message.value='';search.value='';options();prefs.hidden=false;layout();search.focus();
    const folder=await window.yysls.captureFolder(false);
    $('#folder').textContent='记录目录：'+folder;
  }catch(e){message.value=e.message;}
};
$('#folder').onclick=async()=>{
  try{const folder=await window.yysls.captureFolder(true);$('#folder').textContent='记录目录：'+folder;message.value='新目录从下一次采集会话生效';}
  catch(e){message.value=e.message;}
};
$('#prefs-close').onclick=()=>{++revision;closeEditor();};
prefs.onsubmit=async e=>{
  e.preventDefault();if(busy||(search.value.trim()&&!add()))return;
  busy=true;
  try{await window.yysls.monitorSettings({selection:[...draft].map(decode),subject:$('#subject').value,sessionId:settingsSession});closeEditor();}catch(error){message.value=error.message;}finally{busy=false;}
};
window.yysls.subscribeBuff(next=>{state=next||state;receivedAt=Date.now();if(!document.hidden)render();schedule();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();schedule();});
render();
</script></body></html>
